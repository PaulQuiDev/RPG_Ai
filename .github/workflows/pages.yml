name: Deploy RPG_Ai Web

on:
  push:
    branches: [web-host]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages source
        continue-on-error: true
        run: |
          echo "::group::Configurer la source Pages (branche web-host, dossier build/web)"
          STATUS=$(curl -sf -o /tmp/pages_resp -w "%{http_code}" \
            -X PUT \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            -d '{"source":{"branch":"web-host","folder":"/build/web"}}' \
            "https://api.github.com/repos/${{ github.repository }}/pages")
          echo "PUT /pages status: $STATUS"
          echo "Reponse:"
          cat /tmp/pages_resp 2>/dev/null || echo "(pas de reponse)"
          echo ""
          echo "::endgroup::"

      - name: Upload site artifact
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: build/web
          if-no-files-found: error

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
        with:
          artifact_name: site
